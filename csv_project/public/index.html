<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .stats-box { background: #eef; padding: 10px; margin-top: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Успеваемость студентов (Публичный просмотр)</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>ФИО</th>
                <th>Оценки</th>
                <th>Ср. балл</th>
            </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
    </table>
    <div class="stats-box" id="statsBox">
        <h3>Статистика загружается...</h3>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        ws.onmessage = function(event) {
            if (event.data === "update") fetchStudents();
        };

        async function fetchStudents() {
            const res = await fetch('/api/students');
            const students = await res.json();
            const tbody = document.getElementById('studentsTable');
            tbody.innerHTML = '';
            
            students.forEach(s => {
                const tr = document.createElement('tr');
                const gradesStr = s.grades.map(g => g !== null ? g : '-').join(', ');
                tr.innerHTML = `<td>${s.id}</td><td>${s.name}</td><td>${gradesStr}</td><td>${s.average.toFixed(2)}</td>`;
                tbody.appendChild(tr);
            });
            fetchStats();
        }

        async function fetchStats() {
            const res = await fetch('/api/stats');
            const stats = await res.json();
            document.getElementById('statsBox').innerHTML = `
                <h3>Статистика группы</h3>
                <p>Всего: ${stats.count} | Ср. балл: ${stats.overall_avg.toFixed(2)}</p>
                <p>Лучший: ${stats.best || 'нет'} | Худший: ${stats.worst || 'нет'}</p>
            `;
        }
        fetchStudents();
    </script>
</body>
</html>
